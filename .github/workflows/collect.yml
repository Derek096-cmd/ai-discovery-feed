name: Collect GitHub Trending
on:
  schedule:
    # Explicit UTC hours, equivalent to every four hours; avoids timezone ambiguity.
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect.py', 'test_collect.py', '.github/workflows/collect.yml']

permissions:
  contents: read
concurrency:
  group: trending-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-02
      - name: Test collector
        run: python3 -m unittest -v
      - name: Collect public pages
        run: python3 collect.py
      - name: Save snapshot and failure status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/trending.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public Trending snapshot'
            git push origin HEAD:main
          fi
      - name: Report partial failure
        run: test "$(cat collection-status.txt)" = completed
